<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- V3: Icon-only start, then wordmark, but icon is simpler -->
  <g transform="translate(36, 50)">
    <circle cx="0" cy="0" r="28" fill="url(#g)" opacity="0.15"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <g fill="#ffffff">
      <rect x="-3.5" y="-16" width="7" height="32" rx="2"/>
      <rect x="-16" y="-3.5" width="32" height="7" rx="2"/>
    </g>
  </g>
  <!-- Wordmark: gold ampersand -->
  <text x="80" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="36" fill="#ffffff">
    Called <tspan fill="#d4af37">&amp;</tspan> Sent
  </text>
</svg>
