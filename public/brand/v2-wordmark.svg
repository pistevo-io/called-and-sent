<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- V2: Compass-mark on the left, stacked wordmark -->
  <g transform="translate(36, 50)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#g)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0ea5e9" stroke-width="0.5" opacity="0.3"/>
    <g stroke="#0ea5e9" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-26" x2="0" y2="-20"/>
      <line x1="0" y1="20" x2="0" y2="26"/>
      <line x1="20" y1="0" x2="26" y2="0"/>
      <line x1="-26" y1="0" x2="-20" y2="0"/>
    </g>
    <g fill="#ffffff">
      <rect x="-4" y="-18" width="8" height="36" rx="2"/>
      <rect x="-18" y="-4" width="36" height="8" rx="2"/>
    </g>
    <circle cx="0" cy="0" r="3.5" fill="#d4af37"/>
  </g>
  <!-- Stacked wordmark -->
  <text x="80" y="42" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="30" fill="#ffffff">
    CALLED
  </text>
  <text x="80" y="72" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="30" fill="#0ea5e9">
    &amp; SENT
  </text>
</svg>
