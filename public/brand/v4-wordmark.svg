<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- V4: No icon, pure typography with the cross in the ampersand -->
  <text x="40" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="36" fill="#ffffff">
    Called
  </text>
  <!-- Ampersand as a gradient cross symbol -->
  <g transform="translate(185, 50)">
    <rect x="-8" y="-15" width="6" height="30" rx="2" fill="url(#g)"/>
    <rect x="-15" y="-8" width="30" height="6" rx="2" fill="url(#g)"/>
  </g>
  <text x="200" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="36" fill="#ffffff">
    Sent
  </text>
</svg>
