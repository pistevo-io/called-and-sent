<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Globe icon -->
  <g transform="translate(38, 50)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#g)" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="12" ry="26" fill="none" stroke="url(#g)" stroke-width="1.2" opacity="0.5"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="url(#g)" stroke-width="1.2" opacity="0.5"/>
    <!-- Latitude lines -->
    <ellipse cx="0" cy="0" rx="26" ry="8" fill="none" stroke="url(#g)" stroke-width="0.8" opacity="0.3"/>
  </g>
  <text x="80" y="58" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="34" fill="#ffffff">
    Called <tspan fill="#0ea5e9">&amp;</tspan> Sent
  </text>
</svg>
