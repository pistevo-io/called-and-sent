# Cloudflare Worker Configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "called-and-sent-contact-form"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV Namespace for rate limiting
# You'll need to create this in Cloudflare dashboard
[[kv_namespaces]]
binding = "CONTACT_FORM_KV"
id = "454fe16d9d694ce09986680200215b77"

# Environment variables
[vars]
YOUR_EMAIL = "contact@calledandsent.me"

# Routes - configure this after deploying
# This Worker will handle requests to /api/contact
# Example: https://yourdomain.com/api/contact
